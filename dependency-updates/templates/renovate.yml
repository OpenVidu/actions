name: Renovate

# Wrapper. The only thing it decides is WHEN Renovate wakes up; the real cadence
# policy is `schedule` in the shared preset. Everything else lives in
# OpenVidu/actions and never needs to be redeployed here.

on:
  schedule:
    - cron: '0 3 * * 1'      # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  renovate:
    uses: OpenVidu/actions/.github/workflows/renovate-run.yml@b4ecef6892b666b42fe037bc66b696ac9807f205 # v1.0.26
    secrets: inherit
