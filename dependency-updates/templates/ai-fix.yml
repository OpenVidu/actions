name: AI Fix

on:
  workflow_run:
    # Workflow names to watch. Names that don't exist in a given repo simply
    # never fire, so one common list works everywhere.
    # NEVER list "AI Fix" here: it would trigger itself in a loop.
    workflows: ["CI", "Build", "Tests", "Quality", "build-and-test", "verify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to act on
        required: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    uses: OpenVidu/actions/.github/workflows/renovate-ai-fix.yml@41526ed83a611649aa1cddc11cd58ec1e88c859e # v1.0.23
    with:
      max-attempts: 2
    secrets: inherit
